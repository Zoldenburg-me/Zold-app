<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d"><title id="t">How a transfer happens</title><desc id="d">1 Prepare: the server builds the debit with the amount and recipient fixed. 2 Approve: your face or fingerprint approves that exact transfer on your phone. 3 Enforce: the account only executes what was approved. 4 Pay out: Monerium sends euros to the recipient&#x27;s bank. The server never holds a key that can move money.</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
