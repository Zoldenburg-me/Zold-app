</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#918a93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><clipPath id="frame"><rect width="1280" height="470" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="470" fill="#08080b"/><rect x="48.0" y="46.0" width="201.0" height="32" rx="16.0" fill="#0c0a0e" stroke="rgba(242,238,241,0.07)"/><text x="148.5" y="66.6" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#a3909c" text-anchor="middle">How a transfer happens</text><text x="48.0" y="124.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="30" fill="#f2eef1" text-anchor="start" letter-spacing="-0.4">The story in plain words, the stack as the receipt</text><rect x="48" y="168" width="269" height="230" rx="15" fill="#0e0d11" stroke="rgba(242,238,241,0.1)"/><text x="70.0" y="204.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#f06bb4" text-anchor="start" letter-spacing="0.6">01</text><text x="70.0" y="240.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">Prepare</text><text x="70.0" y="274.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Zold builds the transfer.</text><text x="70.0" y="296.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Amount and recipient</text><text x="70.0" y="318.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">are fixed in it.</text><rect x="62" y="350" width="241" height="32" rx="10" fill="rgba(255,255,255,0.02)"/><text x="74.0" y="370.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#a3909c" text-anchor="start" letter-spacing="-0.3">POST /api/transfers</text><path d="M323 283 H347" fill="none" stroke="#918a93" stroke-width="1.4" marker-end="url(#ah)"/><rect x="353" y="168" width="269" height="230" rx="15" fill="#0e0d11" stroke="rgba(237,24,141,0.55)"/><text x="375.0" y="204.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#f06bb4" text-anchor="start" letter-spacing="0.6">02</text><text x="375.0" y="240.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">Approve</text><text x="375.0" y="274.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Your face or fingerprint</text><text x="375.0" y="296.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">approves that exact</text><text x="375.0" y="318.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">transfer on your phone.</text><rect x="367" y="350" width="241" height="32" rx="10" fill="rgba(255,255,255,0.02)"/><text x="379.0" y="370.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#a3909c" text-anchor="start" letter-spacing="-0.3">passkey · WebAuthn</text><path d="M628 283 H652" fill="none" stroke="#918a93" stroke-width="1.4" marker-end="url(#ah)"/><rect x="658" y="168" width="269" height="230" rx="15" fill="#0e0d11" stroke="rgba(242,238,241,0.1)"/><text x="680.0" y="204.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#f06bb4" text-anchor="start" letter-spacing="0.6">03</text><text x="680.0" y="240.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">Enforce</text><text x="680.0" y="274.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Your account runs only</text><text x="680.0" y="296.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">what you approved.</text><text x="680.0" y="318.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Nothing else can.</text><rect x="672" y="350" width="241" height="32" rx="10" fill="rgba(255,255,255,0.02)"/><text x="684.0" y="370.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#a3909c" text-anchor="start" letter-spacing="-0.3">Safe userOp on Base</text><path d="M933 283 H957" fill="none" stroke="#918a93" stroke-width="1.4" marker-end="url(#ah)"/><rect x="963" y="168" width="269" height="230" rx="15" fill="#0e0d11" stroke="rgba(242,238,241,0.1)"/><text x="985.0" y="204.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#f06bb4" text-anchor="start" letter-spacing="0.6">04</text><text x="985.0" y="240.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">Pay out</text><text x="985.0" y="274.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Euros reach the</text><text x="985.0" y="296.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">recipient’s bank.</text><text x="985.0" y="318.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">€0 Zold fee.</text><rect x="977" y="350" width="241" height="32" rx="10" fill="rgba(255,255,255,0.02)"/><text x="989.0" y="370.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#a3909c" text-anchor="start" letter-spacing="-0.3">Monerium redeem · SEPA</text><text x="640.0" y="436.0" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#918a93" text-anchor="middle">The server can prepare a transfer. It holds no key that can approve or block one.</text><rect width="1280" height="470" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="469" rx="20" fill="none" stroke="rgba(242,238,241,0.1)"/></svg>