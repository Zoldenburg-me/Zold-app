<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d"><title id="t">Zold: nothing moves without your yes</title><desc id="d">Zold, the euro account you own. Nothing moves without your yes.</desc><style>@font-face{font-family:ZSans5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZDisplay;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSerif;src:url(data:font/woff2;base64,) format('woff2')}

      .silk{animation:drift 22s cubic-bezier(.4,0,.2,1) infinite alternate;transform-origin:900px 300px}
      .silk2{animation:drift2 28s cubic-bezier(.4,0,.2,1) infinite alternate;transform-origin:900px 300px}
      @keyframes drift{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(-40px,18px) rotate(-3deg)}}
      @keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-14px) scale(1.04)}}
      .w{animation:rise .9s cubic-bezier(.4,0,.2,1) both}
      @keyframes rise{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
      <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7d1050"/><stop offset=".5" stop-color="#ed188d"/><stop offset="1" stop-color="#f06bb4"/></linearGradient>
      <linearGradient id="gB" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1a0f2e"/><stop offset=".6" stop-color="#5b3df5"/><stop offset="1" stop-color="#1a0f2e"/></linearGradient>
      <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbeef6" stop-opacity="0"/><stop offset=".55" stop-color="#fbeef6" stop-opacity=".9"/><stop offset="1" stop-color="#fbeef6" stop-opacity="0"/></linearGradient>
      <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08080b"/><stop offset=".42" stop-color="#08080b" stop-opacity=".92"/><stop offset=".7" stop-color="#08080b" stop-opacity="0"/></linearGradient>
      <radialGradient id="glow" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#ed188d" stop-opacity=".2"/><stop offset="1" stop-color="#ed188d" stop-opacity="0"/></radialGradient>
      <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="softer" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6"/></filter><clipPath id="frame"><rect width="1280" height="560" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="560" fill="#08080b"/><rect width="1280" height="560" fill="url(#glow)"/><g class="silk2"><path d="M420 640 C640 470 820 640 1010 430 S1260 120 1420 160 L1420 420 C1240 420 1140 640 960 690 Z" fill="url(#gB)" filter="url(#soft)" opacity=".95"/></g><g class="silk"><path d="M520 600 C700 440 860 560 1000 380 S1200 90 1400 60 L1400 220 C1230 250 1150 420 1040 520 S760 700 560 680 Z" fill="url(#gA)" filter="url(#soft)" opacity=".9"/><path d="M560 610 C720 470 880 560 1010 400 S1210 120 1400 90" fill="none" stroke="url(#gR)" stroke-width="5" filter="url(#softer)" opacity=".75"/><path d="M640 660 C820 540 930 600 1060 470 S1250 250 1400 230" fill="none" stroke="#7d1050" stroke-width="30" filter="url(#soft)" opacity=".7"/></g><rect width="1280" height="560" fill="url(#veil)"/><rect width="1280" height="560" filter="url(#grain)" opacity=".28" style="mix-blend-mode:overlay"/><path transform="translate(60 46) scale(0.44)" d="M14 20 H86 L50 82.4 Z" fill="none" stroke="#ed188d" stroke-width="8" stroke-linejoin="miter"/><text x="106.6" y="74.2" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="27.3" fill="#f2eef1" text-anchor="start" letter-spacing="-0.55">Zold</text><text x="1216.0" y="76.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#a3909c" text-anchor="end" letter-spacing="0.6">ZOLDHQ.COM</text><text x="64.0" y="262.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="28" fill="#8f8790" text-anchor="start" letter-spacing="-0.28" class="w d1">The euro account you own</text><text x="64.0" y="340.0" font-family="ZDisplay,'DM Sans',system-ui,sans-serif" font-size="63" fill="#f2eef1" text-anchor="start" letter-spacing="-1.2" class="w d2">Nothing moves</text><text x="64.0" y="420.0" font-family="ZSerif,'Instrument Serif',Georgia,serif" font-size="66" fill="#f2eef1" text-anchor="start" class="w d3">without your yes.</text><text x="64.0" y="494.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#f06bb4" text-anchor="start" letter-spacing="0.8" class="w d4">FOR PEOPLE AND COMPANIES WHOSE MONEY CROSSES BORDERS</text><rect width="1280" height="560" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="559" rx="20" fill="none" stroke="rgba(242,238,241,0.1)"/></svg>