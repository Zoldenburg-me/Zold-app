<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">One idea, three proofs</title><desc id="d">For a person: only you can send it. For a company: no one person can empty the account. For everyone: no rate, no asterisk.</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans5;src:url(data:font/woff2;base64,) format('woff2')}
.nw{animation:bob 4.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.type{animation:type 1.4s steps(30,end) .6s both}@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="frame"><rect width="1280" height="420" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <linearGradient id="nwb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1f4"/><stop offset="1" stop-color="#b8a9b3"/></linearGradient>
      <linearGradient id="nwt" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f6f1f4"/><stop offset="1" stop-color="#ed188d"/></linearGradient>
      <filter id="nws" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="420" fill="#08080b"/><rect x="48.0" y="46.0" width="93.4" height="32" rx="16.0" fill="#0c0a0e" stroke="rgba(242,238,241,0.07)"/><text x="94.7" y="66.6" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#a3909c" text-anchor="middle">The idea</text><text x="48.0" y="124.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="35" fill="#f2eef1" text-anchor="start" letter-spacing="-0.5">One idea, three proofs</text><g class="nw"><g transform="translate(470 70) scale(0.6967)" filter="url(#nws)"><path d="M34 81C24 70 14 64 4 66C12 74 14 80 12 82C14 84 12 90 4 98C14 100 24 94 34 83Z" fill="url(#nwb)"/>
      <path d="M196 74C196 98 166 112 126 112C92 112 66 104 48 94L30 86C24 83 24 79 30 76L48 70C66 52 96 40 136 40C172 40 196 54 196 74Z" fill="url(#nwb)"/>
      <path d="M70 96C96 106 150 108 180 90C172 104 150 110 126 110C100 110 82 104 70 96Z" fill="#fff" opacity=".5"/>
      <g fill="#6c5c67" opacity=".3"><ellipse cx="96" cy="58" rx="5" ry="3"/><ellipse cx="118" cy="50" rx="4" ry="2.5"/><ellipse cx="140" cy="52" rx="5" ry="3"/><ellipse cx="78" cy="68" rx="3.5" ry="2.2"/><ellipse cx="160" cy="58" rx="3" ry="2"/></g>
      <path d="M118 98C122 112 112 124 98 126C104 116 106 106 104 98Z" fill="#b8a9b3"/>
      <path d="M104.5 73H121.5L113 87.7Z" fill="none" stroke="#ed188d" stroke-width="2.2" stroke-linejoin="miter"/>
      <circle cx="168" cy="66" r="4.2" fill="#1a1418"/><circle cx="169.4" cy="64.6" r="1.3" fill="#fff"/>
      <path d="M188 60L238 26L241 30L192 67Z" fill="url(#nwt)"/>
      <g stroke="#1a1418" stroke-opacity=".35" stroke-width="1.2"><path d="M198 55L201 60"/><path d="M207 49L210 54"/><path d="M216 43L219 48"/><path d="M225 37L228 42"/></g></g><rect x="483.6" y="26.0" width="269.8" height="32" rx="10" fill="rgba(8,8,11,0.82)" stroke="rgba(242,238,241,0.1)"/><text x="495.6" y="46.5" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#ed188d" text-anchor="start">&gt;</text><text x="511.0" y="46.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#f2eef1" text-anchor="start" class="type">nothing moves without your yes</text></g><rect x="48" y="176" width="376" height="3" fill="#ed188d"/><text x="48.0" y="214.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#a3909c" text-anchor="start" letter-spacing="0.6">FOR A PERSON</text><text x="48.0" y="252.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">Only you can send it.</text><text x="48.0" y="286.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Every transfer waits for your face</text><text x="48.0" y="309.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">or fingerprint, for that exact amount</text><text x="48.0" y="332.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">and recipient. With recovery on, lose</text><text x="48.0" y="355.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">your phone, not your money.</text><rect x="452" y="176" width="376" height="3" fill="#ed188d"/><text x="452.0" y="214.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#a3909c" text-anchor="start" letter-spacing="0.6">FOR A COMPANY</text><text x="452.0" y="252.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">No one person can</text><text x="452.0" y="280.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">empty the account.</text><text x="452.0" y="314.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">One prepares, another approves,</text><text x="452.0" y="337.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">the bookkeeper sorts but can’t send.</text><text x="452.0" y="360.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Your accountant gets the books,</text><text x="452.0" y="383.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">not the keys.</text><rect x="856" y="176" width="376" height="3" fill="#ed188d"/><text x="856.0" y="214.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#a3909c" text-anchor="start" letter-spacing="0.6">FOR EVERYONE</text><text x="856.0" y="252.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="24" fill="#f2eef1" text-anchor="start" letter-spacing="-0.48">No rate. No asterisk.</text><text x="856.0" y="286.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">Zold doesn’t lend your euros out,</text><text x="856.0" y="309.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">so there’s no rate to advertise and</text><text x="856.0" y="332.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">none to quietly cut. Fees are shown</text><text x="856.0" y="355.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#918b94" text-anchor="start">before you approve.</text><rect width="1280" height="420" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="419" rx="20" fill="none" stroke="rgba(242,238,241,0.1)"/></svg>