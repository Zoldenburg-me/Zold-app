<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Backup login · Zold</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/vendor/fonts/text.css" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/ui.css" />
<style>
  body { margin: 0; background: var(--z-bg); color: var(--z-text); font-family: var(--z-font, system-ui, sans-serif); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; line-height: 1.5; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  a { color: var(--z-pink-link); }
  .g-list { list-style: none; padding: 0; margin: 16px 0; }
  .g-list li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--z-line); }
  .g-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
  .g-note { font-size: 13px; color: var(--z-dim); }
  .g-sub { font-size: 17px; margin: 32px 0 8px; }
  .g-steps { margin: 0 0 16px; padding-left: 20px; }
  .g-steps li { margin: 6px 0; }
  @media (max-width: 480px) {
    .g-actions { flex-direction: column; }
    .g-actions .z-btn { width: 100%; justify-content: center; }
  }
  .g-ok { color: var(--z-mint, inherit); }
  .g-err { color: var(--z-red, #c0392b); }
</style>
<main id="g-body" aria-live="polite">
  <h1>Backup login</h1>
  <p>Loading…</p>
</main>
<script type="module" src="/guardian/main.js"></script>
</html>
