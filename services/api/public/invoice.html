<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="/vendor/fonts/text.css" />
<title>Invoice · Zold</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />

<style>
  /*
    An invoice is a tax record that an accountant files and a tax office may
    read. It must survive printing to A4 and forwarding as a PDF, so the sheet
    is white and typeset, and it has to hold two addresses and a per-rate VAT
    table. The sheet and the signing dialog are paper in both colour schemes;
    the page and its cards around them follow the reader's scheme.
  */
  :root {
    --paper: #ffffff;
    --ink: #14141a;
    --ink-soft: #5a5a68;
    --rule: #e2e2e8;
    --sunk: #f6f6f8;

    --bg: #efeff2;
    --panel: var(--paper);
    --border: var(--rule);
    --border2: #d6d6de;
    --text: var(--ink);
    --muted: var(--ink-soft);
    --faint: #7c7c88;
    --acc: var(--ink);
    --field: var(--sunk);
    --soft: #f1f1f4;
    --btn: linear-gradient(#2c2c33, #0e0e12);
    --btn-fg: #fff;
    --green: #1f9d61;
    --amber: #d9652b;
    --red: #d6335c;
    --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --lift: 0 1px 2px rgba(20,20,26,.04), 0 14px 44px rgba(20,20,26,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0e; --panel: #15151a; --border: #26262d; --border2: #34343d;
      --text: #ededf0; --muted: #a3a3ae; --faint: #7c7c88; --acc: #ededf0;
      --field: #1e1e24; --soft: #24242b; --btn: #f1f1f4; --btn-fg: #14141a;
      --green: #3dd68c; --amber: #f0935a; --red: #f4436c;
      --lift: 0 0 0 1px #24242b;
    }
    /* Paper stays paper: everything on it reads the light values. */
    .sheet, dialog {
      --panel: var(--paper); --border: var(--rule); --border2: #d6d6de;
      --text: var(--ink); --muted: var(--ink-soft); --acc: var(--ink);
      --field: var(--sunk); --soft: #f1f1f4; --btn: linear-gradient(#2c2c33, #0e0e12); --btn-fg: #fff;
      --green: #1f9d61; --amber: #d9652b; --red: #d6335c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font: 14px/1.55 var(--font); color: var(--text); background: var(--bg); padding: 1.4rem 1rem 5rem; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: .5rem; font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .actions { display: flex; gap: .5rem; }

  button, .pay-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 1.1rem; border-radius: 999px; border: 0; cursor: pointer; font: 600 .87rem var(--font); color: var(--btn-fg); background: var(--btn); text-decoration: none; transition: opacity .2s, transform .1s; }
  button:active, .pay-btn:active { transform: scale(.98); }
  button.ghost { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--border2); }
  button:disabled { opacity: .35; cursor: not-allowed; }

  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
  .pill.ok { background: rgba(31,157,97,.12); color: var(--green); }
  .pill.warn { background: rgba(217,101,43,.12); color: var(--amber); }
  .pill.mut { background: var(--field); color: var(--muted); }

  /* ── the sheet ─────────────────────────────────────────────────────────── */
  .sheet, .panel { animation: view-in .45s cubic-bezier(.2,.8,.2,1) both; }
  .panel { animation-delay: .08s; }
  .sheet {
    background: var(--paper); color: var(--ink);
    border-radius: 24px;
    padding: clamp(24px, 5vw, 56px);
    box-shadow: var(--lift);
    font-size: 13px; line-height: 1.55;
  }
  .sheet h1 { font-size: clamp(34px, 6vw, 46px); font-weight: 650; letter-spacing: -.04em; line-height: 1.05; margin: 0 0 6px; }
  .sheet .sub { color: var(--ink-soft); font-size: 12px; }

  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  .issuer-block { font-size: 12px; color: var(--ink-soft); text-align: right; line-height: 1.6; }
  .issuer-block strong { color: var(--ink); font-weight: 600; }
  .issuer-logo { display: block; max-width: 220px; max-height: 64px; margin: 0 0 10px auto; object-fit: contain; }

  /* The sender line above the recipient address, as on a German letter. */
  .sender-line { margin-top: 34px; font-size: 9.5px; color: var(--ink-soft); border-bottom: .5px solid var(--rule); padding-bottom: 3px; }
  .parties { display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; margin-top: 10px; }
  .addr { font-size: 13px; line-height: 1.6; }
  .addr .who { font-weight: 600; }
  .meta { font-size: 12px; min-width: 240px; }
  .meta div { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
  .meta .k { color: var(--ink-soft); }
  .meta .v { font-variant-numeric: tabular-nums; }

  table.items { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 12.5px; }
  table.items th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 0 8px 7px; border-bottom: 1px solid var(--text); }
  table.items td { padding: 9px 8px; border-bottom: .5px solid var(--border); vertical-align: top; }
  table.items td.num, table.items th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.items td:first-child, table.items th:first-child { padding-left: 0; }
  table.items td:last-child, table.items th:last-child { padding-right: 0; }

  .totals { margin-top: 18px; display: flex; justify-content: flex-end; }
  .totals table { border-collapse: collapse; font-size: 12.5px; min-width: 280px; }
  .totals td { padding: 5px 0; }
  .totals td.num { text-align: right; font-variant-numeric: tabular-nums; padding-left: 28px; }
  .totals tr.grand td { border-top: 1px solid var(--ink); padding-top: 9px; font-size: 15px; font-weight: 600; }
  /* The euro restatement of a foreign-currency invoice: separated from the
     document's own figures so the two are never read as one column. */
  .totals tr.conv td { border-top: 1px dashed var(--rule, #bbb); padding-top: 9px; font-size: 11.5px; color: var(--ink-soft); }
  .totals tr.conv .basis { display: block; color: var(--faint); font-size: 10.5px; }

  .vat-note { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: 12px; }
  .vat-note .basis { color: var(--ink-soft); font-size: 11px; margin-top: 2px; }

  .blocks { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; font-size: 11.5px; }
  .blocks h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 600; margin-bottom: 5px; }
  .sheet-footer { margin-top: 32px; padding-top: 14px; border-top: .5px solid var(--rule); font-size: 10.5px; color: var(--ink-soft); line-height: 1.65; }

  /* ── signing ───────────────────────────────────────────────────────────── */
  /* The sheet and the signing dialog are the same paper: light, although the
     page around them is dark. */
  .signed { margin-top: 30px; }
  .signed h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 600; }
  .signed .sub { visibility: hidden; }
  .signed.is-signed .sub { visibility: visible; }
  .slot { display: flex; align-items: flex-end; justify-content: flex-start; width: 260px; max-width: 100%; min-height: 66px; margin-bottom: 4px; padding: 0 0 2px; border-radius: 0; border-bottom: .5px solid var(--ink); background: none; color: var(--ink-soft); font-weight: 400; }
  .slot .hint { font-size: 12px; padding-bottom: 5px; }
  .slot:hover .hint { color: var(--ink); }
  .sig { height: 60px; max-width: 100%; overflow: visible; }
  .sig path, #sign-pad path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .sig-typed { font: italic 30px/1.3 "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive; color: var(--ink); }
  .sig-wipe { display: inline-block; padding: 0 .3em; color: inherit; font-size: 24px; line-height: 1; animation: sig-wipe .7s ease-out both; }
  @keyframes sig-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  dialog { margin: auto; border: 0; border-radius: 28px; background: var(--paper); color: var(--ink); padding: 10px 22px 22px; width: min(440px, calc(100vw - 2rem)); box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: auto; }
  dialog[open] { animation: sheet-up .4s cubic-bezier(.2,.8,.2,1); }
  dialog::backdrop { background: rgba(10,10,14,.55); backdrop-filter: blur(3px); animation: fade-in .3s; }
  @keyframes sheet-up { from { transform: translateY(48px); opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 20px; }
  .view { animation: view-in .3s ease-out; }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px); } }
  #sign-dlg h2 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; text-align: center; }
  .await { text-align: center; color: var(--amber); font-size: 13px; font-weight: 600; margin-bottom: .5rem; }
  .lead { text-align: center; color: var(--muted); font-size: 14px; max-width: 36ch; margin: .5rem auto 0; }
  .facts { margin: 1.3rem -22px 0; background: var(--sunk); }
  .facts div { display: flex; justify-content: space-between; gap: 1rem; padding: .85rem 22px; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .facts div:last-child { border-bottom: 0; }
  .facts dt { color: var(--ink-soft); }
  .facts dd { font-weight: 500; font-variant-numeric: tabular-nums; }
  .seg { display: flex; padding: 4px; margin: 1.2rem 0 .9rem; border-radius: 999px; background: #f1f1f4; }
  .seg button { flex: 1; padding: .6rem; border-radius: 999px; background: transparent; color: var(--ink-soft); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pad-wrap { position: relative; }
  #sign-pad { display: block; width: 100%; border-radius: 20px; background: var(--sunk) radial-gradient(circle, #d9d9e0 1px, transparent 1.3px) 0 0 / 14px 14px; cursor: crosshair; touch-action: none; }
  .undo { position: absolute; top: 10px; right: 10px; padding: .3rem .75rem; border-radius: 999px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input.sig-typed { padding: 2.4rem .8rem; border: 0; border-radius: 20px; background: #f6f6f8; color: var(--ink); text-align: center; }
  input.sig-typed:focus { box-shadow: 0 0 0 2px var(--ink); }
  .dlg-actions { display: flex; gap: .6rem; margin-top: 1.2rem; }
  .dlg-actions .pill { flex: 1; display: flex; min-height: 52px; padding: 0 1.4rem; font-size: 15px; letter-spacing: 0; }
  .dlg-actions .pill.soft { flex: 0 0 auto; background: #f1f1f4; color: var(--ink); }
  #sign-go:disabled:has(.sig-wipe) { opacity: 1; }
  @media (max-width: 560px) { dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 28px 28px 0 0; padding-bottom: max(22px, env(safe-area-inset-bottom)); } }
  @media (prefers-reduced-motion: reduce) { dialog[open], dialog::backdrop, .view, .sheet, .panel, .sig-wipe { animation: none; } }

  /* ── compliance panel (app chrome, never printed) ──────────────────────── */
  .panel { background: var(--panel); border-radius: 24px; padding: 1.3rem 1.4rem; margin-top: 1rem; box-shadow: var(--lift); }
  .panel h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em; margin-bottom: .5rem; }
  /* What is owed, and the two things to do about it. */
  .pay-card { text-align: center; padding-top: 1.6rem; }
  .pay-card .await.ok { color: var(--green); }
  .pay-total { font-size: clamp(34px, 7vw, 44px); font-weight: 650; letter-spacing: -.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pay-actions { display: flex; justify-content: center; gap: .6rem; max-width: 440px; margin: 1.2rem auto .4rem; }
  .pay-actions > * { flex: 1; min-height: 52px; font-size: 15px; }
  .pay-actions > .soft { flex: 0 0 auto; background: var(--soft); color: var(--text); padding: 0 1.4rem; }
  .pay-card .note { max-width: 62ch; margin-left: auto; margin-right: auto; }
  .issue { display: flex; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .85rem; }
  .issue:last-child { border-bottom: 0; }
  .issue .basis { color: var(--faint); font-size: .76rem; }
  .err { background: rgba(214,51,92,.07); border: 1px solid rgba(214,51,92,.25); border-radius: 14px; padding: .8rem 1rem; font-size: .87rem; margin-top: 1rem; }
  .note { color: var(--faint); font-size: .8rem; margin-top: .8rem; line-height: 1.6; }

  label { display: block; font-size: .74rem; font-weight: 500; color: var(--muted); margin: .8rem 0 .3rem; }
  input, select, textarea { width: 100%; padding: .7rem .8rem; border-radius: 12px; font-size: .9rem; border: 1px solid transparent; background: var(--field); color: var(--text); font-family: var(--font); }
  input:focus, select:focus { outline: none; border-color: var(--text); background: var(--panel); }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* ── a phone ───────────────────────────────────────────────────────────── */
  /* Quantity and unit price move under the description, so the table keeps
     three columns that fit; print is wider than this and keeps all five. */
  .narrow { display: none; }
  @media (max-width: 560px) {
    body { padding: .9rem .6rem 4rem; }
    .topbar { padding: 0 .4rem; }
    .sheet { padding: 22px 18px; border-radius: 20px; }
    .panel { padding: 1.1rem 1rem; border-radius: 20px; }
    .issuer-block { text-align: left; }
    .issuer-logo { margin-left: 0; }
    .meta { min-width: 0; width: 100%; }
    table.items .wide { display: none; }
    .narrow { display: block; }
    .totals table { min-width: 0; width: 100%; }
    .pay-actions { flex-wrap: wrap; }
    /* The request form's line editor: description on its own row, the three
       numbers under it. */
    table.items:has(#lines) thead { display: none; }
    #lines tr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 0; border-bottom: .5px solid var(--border); }
    #lines td { width: auto !important; padding: 0; border: 0; align-self: center; }
    #lines td:first-child { grid-column: 1 / -1; }
  }

  @media print {
    /* Only the sheet prints, edge to edge on A4. Everything else is chrome. */
    body { background: #fff; padding: 0; }
    .topbar, .panel, .actions, .no-print { display: none !important; }
    .wrap { max-width: none; }
    .sheet { box-shadow: none; border-radius: 0; padding: 0; font-size: 11pt; animation: none; }
    .sheet h1 { font-size: 26px; }
    @page { size: A4; margin: 18mm 16mm; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span aria-hidden="true">▽</span> Zold</div>
    <div class="actions" id="actions"></div>
  </div>
  <div id="content"><div class="panel">Loading…</div></div>
</div>

<script type="module" src="/invoice.js"></script>
