<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<title>Zold Business</title>

<style>
  :root {
    --bg: #0b0b0e;
    --side-bg: #09090c;
    --panel: #131317;
    --panel2: #0e0e12;
    --row: #1a1a1f;
    --border: #232328;
    --border2: #2c2c33;
    --text: #ededf0;
    --muted: #8a8a94;
    --faint: #5b5b66;
    --acc: #ed188d;
    --acc2: #8b5cf6;
    --grad: linear-gradient(90deg, #7b2ff7, #ed188d);
    --green: #3dd68c;
    --amber: #f5a623;
    --red: #f4436c;
    --radius: 12px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: "Space Grotesk", var(--font);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.5 var(--font);
    color: var(--text); background: var(--bg);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(237,24,141,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2c2c33; border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  a { color: var(--acc); text-decoration: none; }
  .hidden { display: none !important; }

  label { display: block; font-size: .74rem; font-weight: 500; color: var(--muted); margin: .85rem 0 .3rem; }
  input, select, textarea {
    width: 100%; padding: .62rem .75rem; border-radius: 8px; font-size: .92rem;
    border: 1px solid var(--border2); background: var(--panel2); color: var(--text);
    font-family: var(--font);
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(237,24,141,.15);
  }
  button {
    padding: .6rem 1.1rem; border-radius: 8px; border: 0; cursor: pointer;
    font-weight: 600; font-size: .88rem; color: #fff; background: var(--acc);
    font-family: var(--font); transition: filter .15s, opacity .15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border2); color: var(--text); }
  button.sm { padding: .35rem .7rem; font-size: .78rem; }

  /* ── shell ─────────────────────────────────────────────────────────── */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { background: var(--side-bg); border-right: 1px solid var(--border); padding: 1rem .75rem; display: flex; flex-direction: column; gap: .25rem; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; padding: .4rem .6rem 1rem; letter-spacing: -.02em; }
  .brand span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .orgpick { margin: 0 .1rem 1rem; }
  .orgpick select { font-size: .84rem; padding: .5rem .6rem; }

  .nav a {
    display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem; border-radius: 8px;
    color: var(--muted); font-size: .87rem; font-weight: 500; cursor: pointer;
  }
  .nav a:hover { background: var(--row); color: var(--text); }
  .nav a.active { background: var(--row); color: var(--text); }
  .nav a .lock { margin-left: auto; font-size: .68rem; color: var(--faint); }
  .nav .sect { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 1rem .6rem .35rem; }

  .main { padding: 1.5rem 1.75rem 4rem; max-width: 1180px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  h1 { font-family: var(--display); font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .86rem; margin-top: .2rem; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-family: var(--display); font-size: .98rem; font-weight: 600; margin-bottom: .2rem; }
  .card .h { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .9rem; }
  .card .desc { color: var(--muted); font-size: .82rem; }

  .grid { display: grid; gap: 1rem; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; }
  .stat .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-family: var(--display); font-size: 1.5rem; font-weight: 600; margin-top: .3rem; letter-spacing: -.02em; }
  .stat .n { font-size: .76rem; color: var(--faint); margin-top: .25rem; }

  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: .5rem .6rem; border-bottom: 1px solid var(--border); }
  td { padding: .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }

  .pill { display: inline-block; padding: .16rem .5rem; border-radius: 99px; font-size: .68rem; font-weight: 600; letter-spacing: .02em; }
  .pill.ok { background: rgba(61,214,140,.14); color: var(--green); }
  .pill.warn { background: rgba(245,166,35,.14); color: var(--amber); }
  .pill.bad { background: rgba(244,67,108,.14); color: var(--red); }
  .pill.mut { background: var(--row); color: var(--muted); }

  /* An upgrade prompt shown IN PLACE of a gated feature, never a hidden nav
     item: hiding a feature makes the product look unfinished, and offering an
     action the API will refuse is worse. */
  .gate { border: 1px dashed var(--border2); border-radius: var(--radius); padding: 1.5rem 1.3rem; text-align: center; background: var(--panel2); }
  .gate h3 { font-family: var(--display); font-size: 1rem; margin-bottom: .35rem; }
  .gate p { color: var(--muted); font-size: .86rem; max-width: 460px; margin: 0 auto .9rem; }
  .gate .needs { font-size: .78rem; color: var(--faint); margin-top: .7rem; }

  .banner { border-radius: var(--radius); padding: .75rem 1rem; margin-bottom: 1rem; font-size: .85rem; display: flex; gap: .75rem; align-items: center; }
  .banner.info { background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.25); }
  .banner.warn { background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.28); }
  .banner button { margin-left: auto; flex-shrink: 0; }

  .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: .87rem; }
  .row-actions { display: flex; gap: .4rem; flex-wrap: wrap; }

  dialog { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: var(--radius); padding: 1.3rem; max-width: 520px; width: calc(100% - 2rem); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { font-family: var(--display); font-size: 1.05rem; margin-bottom: .6rem; }
  .dlg-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.1rem; }

  #toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: var(--row); border: 1px solid var(--border2); padding: .7rem 1.1rem; border-radius: 10px; font-size: .86rem; z-index: 400; max-width: 560px; }
  #toast.bad { border-color: rgba(244,67,108,.5); }

  @media (max-width: 800px) {
    .shell { grid-template-columns: 1fr; }
    .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); align-items: center; }
    .side .brand, .side .sect { display: none; }
    .orgpick { margin: 0; min-width: 160px; }
    .nav { display: flex; gap: .25rem; }
    .nav a { white-space: nowrap; }
    .main { padding: 1rem; }
  }
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">Zold <span>Business</span></div>
    <div class="orgpick"><select id="org-select"></select></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div id="signed-out" class="hidden">
      <div class="head"><div><h1>Sign in first</h1>
        <div class="sub">This dashboard uses the same session as the Zold app.</div></div></div>
      <div class="card">
        <p class="desc">Open <a href="/app">the app</a>, sign in with your passkey, then come back here.</p>
      </div>
    </div>

    <div id="no-orgs" class="hidden">
      <div class="head"><div><h1>Create an organisation</h1>
        <div class="sub">An organisation holds the accounts. A personal one is fine — you can add a business later.</div></div></div>
      <div class="card" style="max-width:460px">
        <label>Name</label><input id="new-org-name" placeholder="Acme GmbH" />
        <label>Type</label>
        <select id="new-org-type">
          <option value="personal">Personal — one person, premium plan available</option>
          <option value="business">Business — members, roles and approvals</option>
        </select>
        <label>Country</label><input id="new-org-country" placeholder="DE" maxlength="2" />
        <div style="margin-top:1rem"><button id="new-org-go">Create</button></div>
      </div>
    </div>

    <div id="app" class="hidden">
      <div id="plan-banner"></div>
      <div class="head">
        <div><h1 id="view-title">Overview</h1><div class="sub" id="view-sub"></div></div>
        <div id="view-actions" class="row-actions"></div>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" class="hidden"></div>

<!--
  FP4 device key. The import map is NOT optional: the vendored noble modules
  import the bare specifiers `crypto` and `@noble/hashes/crypto`, and without
  these mappings device.js never loads and signing hangs with no error. That
  exact bug shipped once in the checkout page — do not drop this block.
-->
<script type="importmap">
{
  "imports": {
    "crypto": "/vendor/crypto-shim.js",
    "@noble/hashes/crypto": "/vendor/hashes/cryptoBrowser.js"
  }
}
</script>
<!-- Classic script: runs during parsing, so the resolver exists before the
     deferred module below calls it. -->
<script>
  window.__deviceLib = new Promise((resolve) => { window.__deviceLibReady = resolve; });
</script>
<script type="module" src="/device.js"></script>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let token = localStorage.getItem("zold-session") || localStorage.getItem("zoll-session");
let orgs = [];
let org = null;          // the full org payload, including `capabilities`
let view = "overview";

function toast(msg, bad = false) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = bad ? "bad" : "";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), bad ? 7000 : 3500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      ...(opts.body && !opts.raw ? { "content-type": "application/json" } : {}),
      ...(token ? { authorization: `Bearer ${token}` } : {}),
      ...(opts.headers || {}),
    },
    body: opts.raw ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) {
    const err = new Error(data.error || `${res.status} ${res.statusText}`);
    Object.assign(err, data, { status: res.status });
    throw err;
  }
  return data;
}

/** Can the current org use this capability? Mirrors the server's verdict. */
const cap = (id) => org?.capabilities?.[id] ?? { allowed: false, label: id };

/**
 * Render an upgrade / unavailable prompt in place of the feature.
 * Never hides the nav entry — a hidden feature reads as a missing one.
 */
function gateHtml(id) {
  const v = cap(id);
  if (v.unavailable) {
    return `<div class="gate"><h3>${esc(v.label)}</h3>
      <p>${esc(v.unavailable)}</p>
      <div class="needs">Not a plan limit — this is not built yet.</div></div>`;
  }
  const plans = (v.requiresPlan || []).join(" or ");
  return `<div class="gate"><h3>${esc(v.label)}</h3>
    <p>${esc(v.upgradeHint || v.reason || "")}</p>
    ${plans ? `<button data-act="upgrade" data-plan="${esc(v.requiresPlan[0])}">Upgrade to ${esc(plans)}</button>
      ${org.trial ? "" : `<button class="ghost" data-act="trial">Start 30-day trial</button>`}` : ""}
    ${plans ? "" : `<div class="needs">${esc(v.reason || "")}</div>`}</div>`;
}

// ── navigation ─────────────────────────────────────────────────────────────

const VIEWS = [
  { id: "overview", label: "Overview", section: "" },
  { id: "accounts", label: "Accounts", section: "" },
  { id: "payments", label: "Payments", section: "Money", capability: "transfers.drafts" },
  { id: "invoices", label: "Invoices", section: "Money", capability: "invoices" },
  { id: "contacts", label: "Contacts", section: "Money" },
  { id: "wallets", label: "Wallets", section: "Treasury" },
  { id: "ledger", label: "Transactions", section: "Books", capability: "ledger.transactions" },
  { id: "assets", label: "Assets", section: "Books", capability: "assets.costBasis" },
  { id: "coa", label: "Chart of accounts", section: "Books", capability: "coa.manage" },
  { id: "members", label: "Members", section: "Admin", capability: "members.manage" },
  { id: "settings", label: "Settings", section: "Admin" },
];

function renderNav() {
  let html = "";
  let section = null;
  for (const v of VIEWS) {
    // Business-only entries stay out of a personal org entirely — that is a
    // product boundary, not a paywall.
    const verdict = v.capability ? cap(v.capability) : { allowed: true };
    if (v.capability && !verdict.allowed && !verdict.requiresPlan && !verdict.unavailable) continue;
    if (v.section !== section) { section = v.section; if (section) html += `<div class="sect">${esc(section)}</div>`; }
    const locked = v.capability && !verdict.allowed;
    html += `<a data-view="${v.id}" class="${view === v.id ? "active" : ""}">${esc(v.label)}
      ${locked ? `<span class="lock">${verdict.unavailable ? "—" : "PRO"}</span>` : ""}</a>`;
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("a").forEach((a) =>
    a.onclick = () => { view = a.dataset.view; render(); });
}

function planBanner() {
  if (!org) return "";
  const t = org.trial;
  if (t && !t.endedAt && new Date(t.endsAt) > new Date()) {
    const days = Math.ceil((new Date(t.endsAt) - new Date()) / 86400000);
    return `<div class="banner info">Trial of <b>${esc(t.grantsPlan)}</b> — ${days} day${days === 1 ? "" : "s"} left.
      When it ends you go back to ${esc(org.plan)}; nothing is deleted.
      <button class="sm" data-act="upgrade" data-plan="${esc(t.grantsPlan)}">Keep it</button></div>`;
  }
  if (org.plan === "starter") {
    return `<div class="banner warn">You are on <b>Starter</b> — payouts, contacts and history.
      ${org.trial ? "Your trial has been used." : "One 30-day trial is available."}
      ${org.trial ? "" : `<button class="sm" data-act="trial">Start trial</button>`}</div>`;
  }
  return "";
}

// ── views ──────────────────────────────────────────────────────────────────

const RENDER = {};

RENDER.overview = async () => {
  const { accounts, currencies } = await api(`/api/orgs/${org.id}/accounts`);
  const open = accounts.filter((a) => a.status === "active");
  const live = currencies.filter((c) => c.available).map((c) => c.code);

  let html = `<div class="grid g3" style="margin-bottom:1rem">
    <div class="stat"><div class="k">Accounts</div><div class="v">${accounts.length}</div>
      <div class="n">${open.length} open, ${accounts.length - open.length} waiting on a partner</div></div>
    <div class="stat"><div class="k">Plan</div><div class="v" style="text-transform:capitalize">${esc(org.effectivePlan)}</div>
      <div class="n">${org.effectivePlan !== org.plan ? "on trial" : esc(org.type) + " organisation"}</div></div>
    <div class="stat"><div class="k">Live rails</div><div class="v">${live.length}</div>
      <div class="n">${live.join(", ") || "none configured"}</div></div>
  </div>`;

  html += cap("dashboard.insights").allowed
    ? `<div class="card"><div class="h"><div><h2>Recent activity</h2>
        <div class="desc">Profit and loss, top assets and recent transactions.</div></div></div>
        <div class="empty">No transactions yet. They appear here once money moves or a wallet syncs.</div></div>`
    : gateHtml("dashboard.insights");
  return html;
};

RENDER.accounts = async () => {
  const { accounts, currencies } = await api(`/api/orgs/${org.id}/accounts`);
  const mock = currencies.find((c) => c.mode === "mock");
  let html = mock
    ? `<div class="banner warn">This deployment is in <b>mock mode</b>. ${esc(mock.mockWarning)}</div>`
    : "";
  html += `<div class="card"><div class="h"><div><h2>Your accounts</h2>
    <div class="desc">An account holds one currency and pays out on that currency's local rail.</div></div>
    <button data-act="open-account">Open an account</button></div>`;

  html += accounts.length ? `<table><thead><tr>
      <th>Currency</th><th>Identifier</th><th>Status</th><th>Provider</th></tr></thead><tbody>` +
    accounts.map((a) => {
      const ident = a.identifier?.iban || a.identifier?.accountNumber || a.identifier?.mobile || "—";
      const pill = a.status === "active" ? "ok" : a.status === "gated" ? "mut" : "warn";
      return `<tr>
        <td><b>${esc(a.currency)}</b><div class="desc">${esc(a.label)}</div></td>
        <td class="mono">${esc(ident)}</td>
        <td><span class="pill ${pill}">${esc(a.status)}</span>
          ${a.gate ? `<div class="desc" style="margin-top:.35rem">${esc(a.gate.reason)}<br>
            <span style="color:var(--faint)">Needs: ${esc(a.gate.needs)}</span></div>` : ""}
          ${a.backingUserId ? `<div class="desc" style="margin-top:.3rem">Funded from your account</div>` : ""}</td>
        <td>${esc(a.provider || "—")}
          ${!a.backingUserId && a.currency === "EUR"
            ? `<div style="margin-top:.4rem"><button class="ghost sm" data-act="fund-account"
                 data-id="${esc(a.id)}">Fund from my account</button></div>` : ""}</td></tr>`;
    }).join("") + `</tbody></table>`
    : `<div class="empty">No accounts yet.</div>`;
  html += `</div>`;

  html += `<div class="card"><div class="h"><div><h2>Currencies</h2>
    <div class="desc">What each rail needs before it can open. Nothing here is simulated.</div></div></div>
    <table><thead><tr><th>Currency</th><th>Rail</th><th>Settlement token</th><th>Status</th></tr></thead><tbody>` +
    currencies.map((c) => `<tr>
      <td><b>${esc(c.code)}</b> <span class="desc">${esc(c.name)}</span></td>
      <td>${esc(c.railName)} <span class="desc">· ${esc(c.provider === "none" ? "no provider identified" : c.provider)}</span></td>
      <td>${c.token
        ? `<b class="mono">${esc(c.token.symbol)}</b>
           <span class="pill mut">${c.token.heldByUs ? "held" : "not held"}</span>
           <div class="desc" style="margin-top:.3rem">${esc(c.token.issuer)}</div>
           <div class="desc" style="margin-top:.3rem">${esc(c.token.backing)}</div>
           ${c.token.liquidityNote ? `<div class="desc" style="margin-top:.3rem">${esc(c.token.liquidityNote)}</div>` : ""}
           <div class="desc mono" style="margin-top:.3rem">${Object.entries(c.token.contracts)
             .map(([ch, a]) => `${esc(ch)} ${esc(a.slice(0, 10))}…${esc(a.slice(-4))}`).join("<br>")}</div>`
        : `<span class="desc">—</span>`}</td>
      <td>${c.available
        ? c.mode === "mock"
          ? `<span class="pill warn">mock</span><div class="desc" style="margin-top:.3rem">${esc(c.mockWarning)}</div>`
          : `<span class="pill ok">live</span>`
        : `<span class="pill mut">not open</span><div class="desc" style="margin-top:.3rem">${esc(c.needs)}</div>`}</td>
    </tr>`).join("") + `</tbody></table>
    <div class="desc" style="margin-top:.7rem">A settlement token existing is not the same as an
    account being open. Where a token is listed and the rail is not, the token is real and we hold
    none of it — the Status column says what is still missing.</div></div>`;
  return html;
};

RENDER.contacts = async () => {
  const { contacts } = await api(`/api/orgs/${org.id}/contacts`);
  return `<div class="card"><div class="h"><div><h2>Address book</h2>
    <div class="desc">A contact holds wallets and bank details. Payouts read from here.</div></div>
    <button data-act="new-contact">Add contact</button></div>` +
    (contacts.length ? `<table><thead><tr><th>Name</th><th>Wallets</th><th>Bank accounts</th><th></th></tr></thead><tbody>` +
      contacts.map((c) => `<tr>
        <td><b>${esc(c.name)}</b>${c.email ? `<div class="desc">${esc(c.email)}</div>` : ""}</td>
        <td class="mono">${c.wallets.map((w) => esc(w.address.slice(0, 10) + "…")).join("<br>") || "—"}</td>
        <td class="mono">${c.bankAccounts.map((b) =>
          `${esc(b.currency)} ${esc(b.iban || b.accountNumber || b.mobile || "")}`).join("<br>") || "—"}</td>
        <td class="row-actions"><button class="ghost sm" data-act="del-contact" data-id="${esc(c.id)}">Delete</button></td>
      </tr>`).join("") + `</tbody></table>`
      : `<div class="empty">No contacts yet.</div>`) + `</div>`;
};

RENDER.wallets = async () => {
  const { wallets } = await api(`/api/orgs/${org.id}/wallets`);
  return `<div class="banner info">Imported wallets are <b>read-only</b>. We never hold a key for one —
    balances and bookkeeping only, and any payment from it is built here and signed by you.</div>

// ── Invoicing: profile and the issue editor ────────────────────────────────
//
// Two rules shape this screen, and both come from the tax code rather than from
// taste:
//  - You may choose which OPTIONAL blocks appear. Everything § 14 UStG requires
//    is always rendered; a settings screen that can switch off a mandatory
//    field is a trap, and it springs on the customer, who loses their
//    input-tax deduction.
//  - Charging VAT and not charging it are a single either/or with a REASON
//    attached, never a rate box you can zero out. Showing tax you do not owe
//    makes you liable for it (§ 14c UStG).

let invoiceDraft = null;

/**
 * What rules apply and how far we check them.
 *
 * The verification level is the honest part: "statutory" means we encoded the
 * paragraphs, "directive" means only the EU baseline and not the member state's
 * own rules, "structural" means no tax law at all. Rendered wherever an invoice
 * is issued so `ok` is never read as more than it is.
 */
function jurisdictionBanner(j, disclaimer, notVerified) {
  const tone = { statutory: "ok", directive: "warn", structural: "bad" }[j.verification] ?? "mut";
  const what = {
    statutory: "Rules encoded to statute",
    directive: "EU baseline only — national rules not encoded",
    structural: "No tax rules applied — structural checks only",
  }[j.verification];
  return `<div class="card">
    <div class="h"><div><h2>${esc(j.countryName)}</h2>
      <div class="desc">${esc(j.basis)}</div></div>
    <span class="pill ${tone}">${esc(what)}</span></div>
    <div class="desc" style="margin-bottom:.7rem">${esc(disclaimer)}</div>
    <div style="font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin-bottom:.35rem">Not checked by Zold</div>
    <ul style="margin:0 0 0 1.1rem; padding:0; color:var(--muted); font-size:.82rem; line-height:1.6">
      ${(notVerified ?? []).map((x) => `<li>${esc(x)}</li>`).join("")}
    </ul></div>`;
}

  return jurisdictionBanner(d.jurisdiction, d.disclaimer, d.notVerified) + `
  <div class="card"><div class="h"><div><h2>Customer</h2>

/** Read the editor's inputs back into the draft. */
function readInvoiceEditor() {
  if (!invoiceDraft) return;
  const val = (id) => $("#" + id)?.value?.trim() ?? "";
  invoiceDraft.recipient = {
    name: val("inv-r-name"), addressLine: val("inv-r-addr"), postalCode: val("inv-r-zip"),
    city: val("inv-r-city"), country: val("inv-r-country").toUpperCase(), vatId: val("inv-r-vat"),
  };
  invoiceDraft.issueDate = val("inv-issue");
  invoiceDraft.supplyDate = val("inv-supply");
  invoiceDraft.purchaseOrder = val("inv-po");
  $("#inv-lines")?.querySelectorAll("input").forEach((el) => {
    invoiceDraft.lines[Number(el.dataset.li)][el.dataset.lf] = el.value;
  });
  if (invoiceDraft.vat.kind === "standard") {
    invoiceDraft.vat.rate = Number($("#inv-rate")?.value ?? 19);
  } else {
    invoiceDraft.vat.reason = $("#inv-reason")?.value ?? invoiceDraft.vat.reason;
    invoiceDraft.vat.note = $("#inv-note")?.value ?? invoiceDraft.vat.note;
  }
}

/** Live compliance panel — the missing-field list while it can still be fixed. */
async function refreshInvoiceCheck() {
  const box = $("#inv-check");
  if (!box || !invoiceDraft) return;
  readInvoiceEditor();
  try {
    const r = await api(`/api/orgs/${org.id}/invoicing/check`, { method: "POST", body: invoiceDraft });
    const t = r.totals;
    const rows = (list, cls) => list.map((i) => `<div class="issue">
      <span class="pill ${cls}">${cls === "bad" ? "required" : "check"}</span>
      <div><div>${esc(i.message)}</div>${i.legalBasis ? `<div class="desc">${esc(i.legalBasis)}</div>` : ""}</div></div>`).join("");
    box.innerHTML = `<div class="h"><div><h2>${r.ok ? "Ready to issue" : `${r.errors.length} thing(s) still needed`}</h2>
        <div class="desc">${esc(r.jurisdiction.countryName)} · ${esc({
          standard: r.jurisdiction.ruleSet === "DE" ? "Full § 14 UStG content"
            : r.jurisdiction.ruleSet === "EU" ? "Full Art. 226 content"
              : "Structural checks only",
          kleinbetrag: "Kleinbetragsrechnung (§ 33 UStDV, up to €250 gross)",
          kleinunternehmer: r.jurisdiction.ruleSet === "DE"
            ? "Kleinunternehmer (§ 19 UStG / § 34a UStDV)" : "Small business scheme",
        }[r.regime])}</div></div>
      <div style="text-align:right"><div class="desc">Total</div>
        <div style="font-size:1.3rem; font-weight:600">${fmtEur(t.grossCents)}</div>
        <div class="desc">net ${fmtEur(t.netCents)}${t.vatCents ? ` · VAT ${fmtEur(t.vatCents)}` : " · no VAT"}</div></div></div>
      ${rows(r.errors, "bad")}${rows(r.warnings, "warn")}
      ${r.ok && !r.warnings.length ? `<div class="desc">Every mandatory field is present.</div>` : ""}`;
  } catch (e) {
    box.innerHTML = `<div class="banner warn">${esc(e.message)}</div>`;
  }
}

const fmtEur = (cents) =>
  new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format((cents ?? 0) / 100);

    await api(`/api/orgs/${org.id}/drafts/${el.dataset.id}/review`, {
      method: "POST", body: { approve: true },
    });
    toast("Approved.");
  },
  /**
   * Send: create one transfer per line, then sign each on this device.
   *
   * Execution and signing are deliberately separate round trips. The server
   * never holds the key, so the batch exists as unsigned transfers until the
   * device signs them — and if signing is abandoned halfway, the rest simply
   * expire without moving anything.
   */
  async "exec-draft"(el) {
    const r = await api(`/api/orgs/${org.id}/drafts/${el.dataset.id}/execute`, { method: "POST" });

    if (r.unsigned) {
      return dialog("Sign in your own wallet",
        `<p class="desc">${esc(r.note)}</p>
         <table><thead><tr><th>To</th><th>Amount</th></tr></thead><tbody>${r.lines
           .map((l) => `<tr><td>${esc(l.destination.displayName)}</td>
             <td class="mono">${esc(l.amount)} ${esc(l.asset)}</td></tr>`).join("")}</tbody></table>`,
        async () => {});
    }
    if (!r.authorizations?.length) return toast(r.note || "Nothing to sign.");

    const lib = await window.__deviceLib;
    const credentialId = localStorage.getItem("zold-credential-id") || undefined;
    let signed = 0;
    const failures = [];
    for (const a of r.authorizations) {
      try {
        const signature = await lib.signTypedData(a.authorization.typedData, credentialId);
        await api(a.authorization.submitTo, { method: "POST", body: { signature } });
        signed++;
        toast(`Signed ${signed}/${r.authorizations.length}…`);
      } catch (e) {
        // Reported per line rather than aborting silently: the ones already
        // signed are real payments and the user must know which.
        failures.push(`${a.recipient}: ${e.message}`);
      }
    }
    toast(
      failures.length
        ? `${signed} of ${r.authorizations.length} sent. Unsent: ${failures.join("; ")}`
        : `All ${signed} payment(s) signed and submitted.`,
      failures.length > 0,
    );
  },
};

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  try { await fn(el); if (!$("#dlg").open) render(); }
  catch (e) { toast(e.message, true); }
});

// ── boot ───────────────────────────────────────────────────────────────────

async function render() {
  if (!org) return;
  renderNav();
  $("#plan-banner").innerHTML = planBanner();
  const def = VIEWS.find((v) => v.id === view);
  const extraTitles = { "invoice-new": "New invoice", "invoicing-settings": "Invoicing profile" };
  $("#view-title").textContent = def?.label ?? extraTitles[view] ?? "Overview";
  $("#view-sub").textContent = `${org.name} · ${org.type} · ${org.effectivePlan}`;
  $("#view").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    $("#view").innerHTML = await (RENDER[view] ?? RENDER.overview)();
    if (view === "invoice-new") {
      refreshInvoiceCheck();
      // Debounced so typing an address is not a request per keystroke.
      let t;
      $("#view").addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(refreshInvoiceCheck, 400);
      });
      $("#inv-contact")?.addEventListener("change", async (e) => {
        if (!e.target.value) return;
        const { contacts } = await api(`/api/orgs/${org.id}/contacts`);
        const c = contacts.find((x) => x.id === e.target.value);
        if (!c) return;
        const b = c.bankAccounts[0];
        $("#inv-r-name").value = c.name;
        if (b?.country) $("#inv-r-country").value = b.country;
        refreshInvoiceCheck();
      });
    }
  } catch (e) {
    // A 402 here means the plan gate fired server-side. Show the same prompt
    // rather than an error, so the two agree.
    $("#view").innerHTML = e.status === 402 || e.status === 409
      ? `<div class="gate"><h3>${esc(e.capability || "Not available")}</h3>
         <p>${esc(e.error)}</p>${e.requiresPlan
           ? `<button data-act="upgrade" data-plan="${esc(e.requiresPlan[0])}">Upgrade</button>` : ""}</div>`
      : `<div class="banner warn">${esc(e.message)}</div>`;
  }
}

async function loadOrg(id) {
  const r = await api(`/api/orgs/${id}`);
  org = r.organisation;
  localStorage.setItem("zold-org", org.id);
}

async function boot() {
  if (!token) { $("#signed-out").classList.remove("hidden"); return; }
  let list;
  try {
    list = await api("/api/orgs");
  } catch (e) {
    if (e.status === 401) { $("#signed-out").classList.remove("hidden"); return; }
    throw e;
  }
  orgs = list.organisations;
  if (!orgs.length) {
    $("#no-orgs").classList.remove("hidden");
    $("#new-org-go").onclick = async () => {
      try {
        const r = await api("/api/orgs", {
          method: "POST",
          body: {
            name: $("#new-org-name").value,
            type: $("#new-org-type").value,
            country: $("#new-org-country").value,
          },
        });
        location.reload();
      } catch (e) { toast(e.message, true); }
    };
    return;
  }
  const wanted = localStorage.getItem("zold-org");
  org = orgs.find((o) => o.id === wanted) ?? orgs[0];
  $("#org-select").innerHTML = orgs
    .map((o) => `<option value="${esc(o.id)}" ${o.id === org.id ? "selected" : ""}>${esc(o.name)}</option>`)
    .join("");
  $("#org-select").onchange = async (e) => { await loadOrg(e.target.value); view = "overview"; render(); };
  await loadOrg(org.id);
  $("#app").classList.remove("hidden");
  render();
}

boot().catch((e) => toast(e.message, true));
</script>
