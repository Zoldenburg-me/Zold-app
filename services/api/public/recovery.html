<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Get your account back · Zold</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/vendor/fonts/text.css" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/ui.css" />
<style>
  body { margin: 0; background: var(--z-bg); color: var(--z-text); font-family: var(--z-font, system-ui, sans-serif); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; line-height: 1.5; }
  h1 { font-size: 24px; margin: 0 0 12px; outline: none; }
  a { color: var(--z-pink-link); }
  label { display: block; font-size: 14px; margin: 16px 0 6px; color: var(--z-dim); }
  input { box-sizing: border-box; width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--z-line-strong, #444); background: transparent; color: inherit; }
  .r-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
  .r-note { font-size: 13px; color: var(--z-dim); }
  .r-err { color: var(--z-red, #e5484d); margin: 12px 0 0; }
  .r-ref b { font-family: ui-monospace, monospace; letter-spacing: 0.04em; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  .r-warn { font-size: 14px; padding: 10px 12px; border-radius: 12px; background: var(--z-amber-tint); border: 1px solid var(--z-amber-border); }
  .r-done { font-weight: 600; }
  .r-list { list-style: none; padding: 0; margin: 16px 0 0; border: 1px solid var(--z-line-strong, #444); border-radius: 12px; }
  .r-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; }
  .r-list li + li { border-top: 1px solid var(--z-line-strong, #444); }
  .r-list span { color: var(--z-dim); }
  .r-list b { text-align: right; overflow-wrap: anywhere; }
  #r-bank-ref { font-family: ui-monospace, monospace; letter-spacing: 0.04em; }
  @media (max-width: 480px) {
    .r-actions { flex-direction: column; }
    .r-actions .z-btn { width: 100%; justify-content: center; }
  }
</style>
<main id="r-body" aria-live="polite">
  <h1>Get your account back</h1>
  <p>Loading…</p>
</main>
<script type="module" src="/recovery/main.js"></script>
</html>
