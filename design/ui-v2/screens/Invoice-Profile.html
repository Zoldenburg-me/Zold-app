<!doctype html>

<title>Invoice details, set once</title>

<link rel="stylesheet" href="../assets/fonts/inter.css"><link rel="stylesheet" href="../assets/fonts/material-symbols.css">
<style>
body{margin:0;background:#08080b;font-family:Inter, system-ui, sans-serif;color:#ededf0;-webkit-font-smoothing:antialiased}
a{color:#f06bb4;text-decoration:none}a:hover{color:#ff8fc4}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ed188d;outline-offset:2px}
input::placeholder{color:#9a9aa5}
:root{color-scheme:dark}
a,button,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-p{transition:background-color .15s ease,transform .1s ease}.btn-p:hover{background:#ff2d9e !important;color:#fff !important}
.btn-s{transition:border-color .15s ease,transform .1s ease}.btn-s:hover{border-color:#5a5a62 !important;color:#ededf0 !important}
.btn-p:active,.btn-s:active{transform:translateY(1px)}
.lnk{transition:color .15s ease}.lnk:hover{color:#ededf0 !important}
.skip{position:absolute;left:16px;top:-60px;padding:10px 14px;border-radius:10px;background:#ed188d;color:#08080b !important;font-weight:600;z-index:10}.skip:focus{top:12px}
.m-fig{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

</head>
<body>

<div style="width: 412px; min-height: 844px; box-sizing: border-box; position: relative; background: #08080b; display: flex; flex-direction: column; overflow: hidden"><div aria-hidden="true" style="position: absolute; inset: -160px 0 auto; height: 520px; pointer-events: none; background: radial-gradient(60% 50% at 50% 30%, rgba(237,24,141,.22), rgba(237,24,141,.05) 55%, transparent 72%)"></div><div style="position: relative; flex-grow: 1; display: flex; flex-direction: column">
<div role="status" style="padding: 10px 16px 0; display: flex; justify-content: center">
<span style="display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px; border-radius: 999px; background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.32); font-size: 11.5px; font-weight: 500; color: #f5a623"><span class="ms" aria-hidden="true" style="font-size: 14px; color: #f5a623">science</span>Test mode, no real money</span>
</div>
<header style="height: 60px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; gap: 6px"><a href="Invoice-Editor.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 24px; color: #ededf0">arrow_back</span></a><h1 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #fbf9fc">Your invoice details</h1></header>
<main style="flex-grow: 1; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px"><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #9a9aa5">Set these once. They go on every invoice you issue.</p>
<label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Name on invoices</span><input value="Miriam Zoldenburg" name="name_on_invoices" inputmode="text" autocomplete="off" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #2c2c33; background: #0e0e12; color: #ededf0; font-family: inherit; font-size: 16px; text-align: left"></label>
<label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Business name or trade</span><input value="Grafikdesign" name="business_name_or_trade" inputmode="text" autocomplete="off" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #2c2c33; background: #0e0e12; color: #ededf0; font-family: inherit; font-size: 16px; text-align: left"><span style="font-size: 12.5px; line-height: 1.45; color: #9a9aa5">Optional. Shown under your name.</span></label>
<label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Address</span><input value="Franz-Josef-Str. 11, 80801 München" name="address" inputmode="text" autocomplete="off" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #2c2c33; background: #0e0e12; color: #ededf0; font-family: inherit; font-size: 16px; text-align: left"></label>
<section style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #9a9aa5">Tax</span>
<div role="radiogroup" aria-label="Tax status" style="display: flex; padding: 4px; border-radius: 999px; border: 1px solid #2c2c33; background: #0e0e12"><button type="button" role="radio" aria-checked="true" style="flex: 1; min-height: 38px; padding: 0 8px; border-radius: 999px; border: 0; background: #ed188d; color: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer">Kleinunternehmer</button><button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 38px; padding: 0 8px; border-radius: 999px; border: 0; background: transparent; color: #9a9aa5; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer">Charges VAT</button></div>
<label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Tax number (Steuernummer)</span><input placeholder="144/123/45678…" name="tax_number_steuernummer" inputmode="text" autocomplete="off" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #2c2c33; background: #0e0e12; color: #ededf0; font-family: inherit; font-size: 16px; text-align: left"><span style="font-size: 12.5px; line-height: 1.45; color: #9a9aa5">Or a VAT ID if you have one. German invoices need one of the two.</span></label></section>
<div style="border: 1px solid #232328; border-radius: 16px; background: linear-gradient(180deg,#131317,#0d0d11); overflow: hidden"><div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 0 solid #232328"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 12.5px; color: #9a9aa5">Paid to</span><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 14px; color: #ededf0; overflow-wrap: anywhere">GB59 MONE 0000 0042 8817</span></span><button type="button" aria-label="Copy Paid to" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid #2c2c33; background: rgba(255,255,255,.03); display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 19px; color: #ededf0">content_copy</span></button></div></div></main>
<div style="padding: 14px 16px 28px"><a href="Invoice-Editor.html" class="btn-p" style="width: 100%; box-sizing: border-box; height: 54px; padding: 0 22px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0; white-space: nowrap; background: #ed188d; color: #fff; border: 1px solid #ed188d; box-shadow: 0 10px 34px rgba(237,24,141,.4)"><span>Save</span></a></div></div></div>
